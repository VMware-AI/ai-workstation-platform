[project]
name = "agent-platform-scale-bundle"
version = "0.1.0"
description = "Agent Platform C9: scale bundle pack/sign/verify (cosign)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "VMware-AI / Agent Platform team"}]
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
pack = [
    "zstandard>=0.22",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # keep in sync with the `pack` extra — the pack-path tests must actually
    # run in CI, not silently skip on a missing zstandard.
    "zstandard>=0.22",
]

[project.scripts]
agent-platform-bundle = "agent_platform_scale_bundle.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_platform_scale_bundle"]
