[project]
name = "agent-platform-telemetry-shim"
version = "0.1.0"
description = "Agent Platform C7: agent-neutral telemetry shim (Protocol + ingest pusher + circuit breaker)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "VMware-AI / Agent Platform team"}]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
agent-platform-tele-claude-code = "agent_platform_telemetry_shim.adapters.claude_code:main"
agent-platform-tele-qcoder = "agent_platform_telemetry_shim.adapters.qcoder:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_platform_telemetry_shim"]
