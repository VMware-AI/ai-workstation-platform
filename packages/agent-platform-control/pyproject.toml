[project]
name = "agent-platform-control"
version = "0.1.0"
description = "Agent Platform C1: control plane API + orchestration"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "VMware-AI / Agent Platform team"}]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "cryptography>=42",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    # C13 approval workflow: its router and ORM models. The control
    # plane mounts the router and shares its Postgres alongside the
    # main async pool — see db/sync_session.py.
    "agent-platform-approval[http]>=0.1.0",
    # C18 per-VM secret store — imported at runtime by api/cloud_init.py
    # (VmSecretStore). Was previously only on PYTHONPATH in CI; declaring it
    # makes the dependency real so `uv run` installs it (harness doc 34 H-2).
    "agent-platform-secrets>=0.1.0",
    # H-14 #215: reuse C7's 3-state CircuitBreaker for vCenter SmartConnect
    "agent-platform-telemetry-shim>=0.1.0",
    "pyvmomi>=8.0",
    # vCenter inventory surface (R-3 of admin console redesign). Imported only
    # from vmware_aiops.ops.* — never vmware_aiops.mcp_server which registers
    # MCP tools at import (see CLAUDE.md pitfall #32, docs/architecture/21 §6).
    "vmware-aiops>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[project.scripts]
agent-platform-control = "agent_platform_control.cli:main"

# agent-platform-approval and -secrets are sibling workspace members, not published
# package — without this uv cannot resolve it and `uv sync` fails for the whole
# workspace (root cause of CI's silently non-running pytest, #59).
[tool.uv.sources]
agent-platform-approval = { workspace = true }
agent-platform-secrets = { workspace = true }
agent-platform-telemetry-shim = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_platform_control"]
