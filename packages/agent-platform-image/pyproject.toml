[project]
name = "agent-platform-image"
version = "0.1.0"
description = "Agent Platform C3 — golden image cloud-init templates + tests"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Pure data package — only ship cloud-init/ as a payload.
only-include = ["cloud-init"]

[tool.pytest.ini_options]
testpaths = ["tests"]
