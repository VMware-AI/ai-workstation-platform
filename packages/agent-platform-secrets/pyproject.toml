[project]
name = "agent-platform-secrets"
version = "0.1.0"
description = "Agent Platform C18: Vaultwarden client + secret reference resolver for control-plane config"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "VMware-AI / Agent Platform team"}]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_platform_secrets"]
