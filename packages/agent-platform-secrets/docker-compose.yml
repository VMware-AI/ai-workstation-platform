# C18 agent-platform-secrets — Vaultwarden + Caddy
#
# Vaultwarden is the Rust reimplementation of the Bitwarden server. It
# stores the platform's per-tenant secrets (vCenter passwords, LLM API
# keys, agent bootstrap tokens) so config.yaml files no longer carry
# plaintext credentials.
#
# Caddy terminates TLS in front of Vaultwarden. Vaultwarden itself only
# listens on the internal docker network — it is never directly
# reachable from outside the host.
#
# Image tags are version-pinned. For production, operators should
# additionally pin by digest (`vaultwarden/server:1.32.4@sha256:...`)
# once a release has been validated against the local environment.

services:
  vaultwarden:
    image: vaultwarden/server:1.32.4
    container_name: agent-platform-vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: ${AGENT_PLATFORM_SECRETS_DOMAIN:?AGENT_PLATFORM_SECRETS_DOMAIN must be set in .env}
      # Signups MUST be disabled — accounts are provisioned by the
      # platform admin via the /admin panel.
      SIGNUPS_ALLOWED: "false"
      # Admin panel is protected by the Argon2-hashed token; generate
      # with `vaultwarden hash` or `argon2 -id`. Never commit the
      # plain token.
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN:?VAULTWARDEN_ADMIN_TOKEN must be set}
      # Vaultwarden runs unencrypted behind Caddy; the TLS terminates at
      # the reverse proxy.
      ROCKET_PORT: "80"
      WEBSOCKET_ENABLED: "true"
      # Tighten the default log level to drop request bodies from
      # general logs.
      LOG_LEVEL: warn
      EXTENDED_LOGGING: "true"
      # Disable telemetry / "send" public links by default.
      SENDS_ALLOWED: "false"
      EMERGENCY_ACCESS_ALLOWED: "false"
      # Database backend defaults to SQLite at /data/db.sqlite3.
    volumes:
      - vaultwarden-data:/data
    networks:
      - agent-platform-secrets-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/alive"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2.10.0-alpine
    container_name: agent-platform-secrets-caddy
    restart: unless-stopped
    ports:
      - "${AGENT_PLATFORM_SECRETS_HTTP_PORT:-80}:80"
      - "${AGENT_PLATFORM_SECRETS_HTTPS_PORT:-443}:443"
    environment:
      AGENT_PLATFORM_SECRETS_DOMAIN: ${AGENT_PLATFORM_SECRETS_DOMAIN}
      # Issuer email for ACME registrations when running on a public
      # domain. Ignored in `tls internal` mode.
      AGENT_PLATFORM_SECRETS_ACME_EMAIL: ${AGENT_PLATFORM_SECRETS_ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - agent-platform-secrets-net
    depends_on:
      vaultwarden:
        condition: service_healthy

volumes:
  vaultwarden-data:
  caddy-data:
  caddy-config:

networks:
  agent-platform-secrets-net:
    driver: bridge
