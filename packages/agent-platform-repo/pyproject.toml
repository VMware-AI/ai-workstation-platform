[project]
name = "agent-platform-repo"
version = "0.1.0"
description = "Agent Platform C4: private PyPI (devpi) skeleton — upload / verify / index hooks for scale bundles"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "VMware-AI / Agent Platform team"}]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "packaging>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
agent-platform-repo = "agent_platform_repo.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_platform_repo"]
