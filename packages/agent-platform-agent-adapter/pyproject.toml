[project]
name = "agent-platform-agent-adapter"
version = "0.1.0"
description = "Agent Platform C20: Multi-agent abstraction layer + agent CLI"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "VMware-AI / Agent Platform team"}]
dependencies = [
    "click>=8.1",
    # C7 supplies the three-state CircuitBreaker used by CircuitBreakerShim
    # (telemetry.py). It's a core dep — the runner imports telemetry on every
    # agent launch — not just the optional [ingest] HTTP bridge below.
    "agent-platform-telemetry-shim>=0.1.0",
]

[project.optional-dependencies]
# Optional HTTP bridge: the shim's IngestClient pulls in httpx transitively.
# Importing telemetry_ingest fails loud without it.
ingest = [
    "agent-platform-telemetry-shim>=0.1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "agent-platform-telemetry-shim>=0.1.0",
]

[project.scripts]
agent = "agent_platform_agent_adapter.cli:main"

# agent-platform-telemetry-shim is a sibling workspace member, not a published
# package — without this uv cannot resolve it and `uv sync` fails for the whole
# workspace (which is why CI's `uv run pytest` silently never ran). See #59.
[tool.uv.sources]
agent-platform-telemetry-shim = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_platform_agent_adapter"]
