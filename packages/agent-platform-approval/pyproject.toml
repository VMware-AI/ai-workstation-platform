[project]
name = "agent-platform-approval"
version = "0.1.0"
description = "Agent Platform C13: approval workflow state machine + audit log"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "VMware-AI / Agent Platform team"}]
dependencies = [
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
http = [
    "fastapi>=0.110",
    "pydantic>=2.6",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "fastapi>=0.110",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_platform_approval"]
