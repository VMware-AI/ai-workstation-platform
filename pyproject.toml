[project]
name = "ai-workstation-platform"
version = "0.1.0"
description = "AI Workstation Platform — Agent Platform monorepo"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
eval = [
    "openai>=2.41.1",
    "pyyaml>=6.0",
]

[tool.uv.workspace]
members = [
    "packages/agent-platform-agent-adapter",
    "packages/agent-platform-approval",
    "packages/agent-platform-control",
    "packages/agent-platform-fileshare",
    "packages/agent-platform-image",
    "packages/agent-platform-installer",
    "packages/agent-platform-llm-gateway",
    "packages/agent-platform-llm-runtime",
    "packages/agent-platform-pool-scheduler",
    "packages/agent-platform-repo",
    "packages/agent-platform-scale-bundle",
    "packages/agent-platform-secrets",
    "packages/agent-platform-telemetry-shim",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# poc/ are M0 throwaway PoC scripts (no tests, not shipped); the lint gate
# protects product code (#217).
extend-exclude = ["poc"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "A", "C4", "SIM", "RUF"]
ignore = [
    "S101",   # allow assert in tests
    "B008",   # function call in default — FastAPI Depends()/Typer Option() idiom
    "RUF001", # ambiguous-unicode: CJK punctuation in Chinese comments/docs is
    "RUF002", # intentional project-wide, not a confusable-character attack
    "RUF003", # surface (#217)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S"]
# conftest.py legitimately mutates sys.path before imports (workspace src layout)
"**/conftest.py" = ["E402"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov-report=term-missing --ignore=packages/agent-platform-e2e"
testpaths = ["packages/*/tests", "eval/tests"]
# agent-platform-e2e has its own pyproject + heavyweight deps (playwright); run it
# standalone via `cd packages/agent-platform-e2e && uv run pytest`.
markers = [
    "unit: unit tests (fast, no I/O)",
    "integration: integration tests (need ESXi / NSX / Postgres)",
    "e2e: end-to-end tests",
    "slow: takes > 30s",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "node_modules"]
